name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspaces --if-present
      - name: Lint
        run: npm run lint --workspaces --if-present
      - name: Lesson tests
        run: npm run test:lesson
      - name: Build
        run: npm run build --workspaces --if-present

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/user/go.sum
            tests/go.sum
      - name: Gofmt
        run: test -z "$(gofmt -l services/user tests)"
      - name: Vet
        run: go -C services/user vet ./...
      - name: Unit tests with the race detector
        run: npm run test:ci
      - name: Build binaries
        run: go -C services/user build ./...

  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit_dev_password
          POSTGRES_DB: kit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kit -d kit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://kit:kit_dev_password@localhost:5432/kit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/user/go.sum
            tests/go.sum
      # The harness creates and migrates kit_test itself, so no manual migration step.
      - name: Integration tests
        run: go -C tests test ./int/user/... -count=1

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/user/go.sum
            tests/go.sum
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Go vulnerability scan
        run: go -C services/user run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/user/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
