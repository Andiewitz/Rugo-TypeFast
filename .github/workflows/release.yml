name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The tag and the Build Version shown in the app must be the same number.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi

      - name: Lowercase the registry path
        id: registry
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/user/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.owner }}/type-fast-user:${{ github.ref_name }}
            ghcr.io/${{ steps.registry.outputs.owner }}/type-fast-user:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: ${{ github.ref_name }}
    secrets: inherit
